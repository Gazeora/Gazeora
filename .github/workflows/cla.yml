# Asks each new contributor to sign CLA.md once, on their first pull request, and records the
# signature in signatures/cla.json on the cla-signatures branch. CONTRIBUTING.md says why.
# No checkout: pull_request_target runs with write access, so it must never run the PR's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Gazeora/Gazeora/blob/master/CLA.md
          branch: cla-signatures  # unprotected, unlike master
          allowlist: NithinAashikPS,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for your pull request! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/Gazeora/Gazeora/blob/master/CLA.md)
            and sign it by posting the comment below. You only need to do this once. It lets
            Gazeora stay under the GPL version 3 while also being offered under a commercial
            license; you keep the copyright in your work.
