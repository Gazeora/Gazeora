# Builds and tests both releases (x64 and x86) and packs their MSIs. A published GitHub
# release also gets the two MSIs attached, and then gazeora.github.io is told about it.
# weekly-release.yml calls this with a tag it made: that tag is built, and released as a
# pre-release with its MSIs.
name: CI

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: The pre-release's tag, already pushed
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}  # empty: the event's own
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  build:
    name: Build and test (${{ matrix.arch }})
    needs: format
    runs-on: windows-latest
    strategy:
      fail-fast: true  # one release failing cancels the other
      matrix:
        include:
          - arch: x64
            vcvars: x64
          - arch: x86
            vcvars: amd64_x86
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}  # empty: the event's own

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: ${{ matrix.vcvars }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DGAZEORA_STREAM_OVERLAY=OFF

      - name: Build
        run: cmake --build build

      # Retried because a stream test can starve for CPU on a busy machine
      - name: Test
        run: ctest --test-dir build --output-on-failure --repeat until-pass:3

      - name: Pack the MSI
        run: cmake --build build --target gazeora_msi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gazeora-msi-${{ matrix.arch }}
          path: build/Gazeora-*-${{ matrix.arch }}.msi
          if-no-files-found: error
          # Release runs keep theirs longest; the release itself holds the permanent copy
          retention-days: ${{ (github.event_name == 'release' || inputs.tag) && 90 || 7 }}

  publish:
    name: Attach MSIs to the release
    if: github.event_name == 'release' || inputs.tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}  # empty: the event's own

      - name: Check the tag matches VERSION
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Release tag $TAG does not match VERSION ($expected)"
            exit 1
          fi

      - name: Check release candidates are pre-releases
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "$TAG" in
            *-rc.*) wanted=true ;;
            *) wanted=false ;;
          esac
          if [ "$PRERELEASE" != "$wanted" ]; then
            echo "::error::$TAG must be published with pre-release set to $wanted"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: gazeora-msi-*
          path: dist
          merge-multiple: true

      - name: Upload to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.msi --clobber --repo "$GITHUB_REPOSITORY"

      # Notes from the pull requests merged since the last release
      - name: Publish the weekly pre-release
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/*.msi --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --title "Gazeora $TAG" --generate-notes

      # Once the MSIs are attached, so the website lists them with the release
      - name: Tell the website
        uses: Gazeora/gazeora.github.io/.github/actions/publish-release@main
        with:
          platform: windows
          site-token: ${{ secrets.GAZEORA_SITE_TOKEN }}
          tag: ${{ inputs.tag || github.event.release.tag_name }}
