# Every Monday, a patch pre-release of what master has gained since the highest release:
# v1.0.1-rc.1 is followed by v1.0.2-rc.1, a stable v1.0.3 by v1.0.4-rc.1. Nothing changed
# (VERSION aside), nothing released. Master only takes pull requests, so the release commit
# (master with the new VERSION) sits off it, tagged; master's own VERSION isn't changed.
name: Weekly pre-release

on:
  schedule:
    - cron: "0 0 * * 1"  # every Monday, 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-release

jobs:
  tag:
    name: Tag the pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: master
          fetch-depth: 0  # with the tags, to compare against the last release

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(gh release list --exclude-drafts --limit 1000 --json tagName -q '.[].tagName' |
            .github/scripts/weekly-version.sh)
          read -r last next <<< "$versions"
          if git diff --quiet "$last" HEAD -- . ':(exclude)VERSION'; then
            echo "Nothing has changed since $last: no pre-release this week." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Changes since $last: releasing $next." >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      # Forced: a tag left by a week whose build failed is made again from today's master
      - name: Tag the release commit
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${TAG#v}" > VERSION
          git commit -q -m "chore: release $TAG" VERSION
          git tag -f -a "$TAG" -m "Gazeora $TAG"
          git push -f origin "refs/tags/$TAG"

  release:
    name: Build and release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
